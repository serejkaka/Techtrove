<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse smartphones at TechTrove. Shop iPhone, Samsung with May Sale discounts.">
    <title>Popular Phones - TechTrove</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap');
    </style>
</head>
<body>
    <header class="sticky">
        <nav class="navbar">
            <div class="logo"><a href="index.html">TechTrove</a></div>
            <div class="search-bar">
                <input type="text" placeholder="Search products..." aria-label="Search">
                <button>🔍</button>
            </div>
            <div class="nav-icons">
                <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
                <a href="#" id="cart-icon" aria-label="Cart">🛒 <span id="cart-count">0</span></a>
                <a href="#" aria-label="Login">👤</a>
            </div>
        </nav>
        <div class="categories">
            <a href="category.html?cat=phones">Popular Phones</a>
            <a href="category.html?cat=dyson">Dyson Products</a>
            <a href="category.html?cat=tvs">TVs</a>
            <a href="category.html?cat=tablets">Tablets</a>
            <a href="category.html?cat=accessories">Accessories</a>
            <a href="category.html?cat=sales">May Sale</a>
        </div>
    </header>

    <main>
        <section class="category-page">
            <aside class="filters">
                <h3>Filters</h3>
                <div>
                    <label>Brand:</label>
                    <select id="filter-brand">
                        <option value="all">All</option>
                        <option value="apple">Apple</option>
                        <option value="samsung">Samsung</option>
                    </select>
                </div>
                <div>
                    <label>Price Range:</label>
                    <input type="range" min="0" max="2000" value="2000" id="filter-price">
                    <span id="price-value">€2000</span>
                </div>
            </aside>
            <div class="product-grid">
                <article class="product-card" data-id="iphone16">
                    <img src="https://images.unsplash.com/photo-1607936854279-55e8a4c64888" alt="iPhone 16" loading="lazy">
                    <h3>iPhone 16</h3>
                    <p>Latest Apple smartphone with A18 chip.</p>
                    <div class="price">
                        <span class="original-price">€999</span>
                        <span class="sale-price">€799</span>
                        <span class="discount-badge">-20%</span>
                    </div>
                    <div class="rating">★★★★☆</div>
                    <button class="add-to-cart" data-id="iphone16">Add to Cart</button>
                    <button class="quick-view" data-id="iphone16">Quick View</button>
                    <a href="product.html?id=iphone16" class="product-link">View Details</a>
                </article>
                <article class="product-card" data-id="galaxys24">
                    <img src="https://images.unsplash.com/photo-1610945415295-d9bbf067e59c" alt="Samsung Galaxy S24" loading="lazy">
                    <h3>Samsung Galaxy S24</h3>
                    <p>High-performance AMOLED smartphone.</p>
                    <div class="price">
                        <span class="original-price">€899</span>
                        <span class="sale-price">€719</span>
                        <span class="discount-badge">-20%</span>
                    </div>
                    <div class="rating">★★★★★</div>
                    <button class="add-to-cart" data-id="galaxys24">Add to Cart</button>
                    <button class="quick-view" data-id="galaxys24">Quick View</button>
                    <a href="product.html?id=galaxys24" class="product-link">View Details</a>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="newsletter">
                <h3>Subscribe to Newsletter</h3>
                <form id="newsletter-form">
                    <input type="email" placeholder="Enter your email" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>

    <div class="quick-view-popup hidden" id="quick-view-popup">
        <div class="quick-view-content">
            <button class="close-popup">✖</button>
            <img src="" alt="Product" id="quick-view-image" loading="lazy">
            <h3 id="quick-view-title"></h3>
            <p id="quick-view-description"></p>
            <div class="price" id="quick-view-price"></div>
            <button class="add-to-cart" id="quick-view-add">Add to Cart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
